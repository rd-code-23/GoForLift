services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: goforlift
      POSTGRES_USER: goforlift
      POSTGRES_PASSWORD: goforlift_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U goforlift -d goforlift']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
